plugins {
    id 'com.android.application'
}

android {
    namespace 'hr.drnas.nativeprobe'
    compileSdk 35
    ndkVersion '27.2.12479018'

    defaultConfig {
        // Isolated Vulkan GUI experiment: does not replace DRNAS Native LAB
        // or existing EmuDRNAS installations.
        applicationId 'hr.drnas.nativeghost'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.2-ghost-input-bridge-lab'
        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                cFlags '-std=c11 -Wall -Wextra'
            }
        }
    }
    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }
    packaging {
        jniLibs {
            // Standalone Android ELF is kept in executable nativeLibraryDir.
            useLegacyPackaging = true
            keepDebugSymbols += ['**/libblender.so']
        }
    }
}
