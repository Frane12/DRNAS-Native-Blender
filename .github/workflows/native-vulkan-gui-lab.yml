name: DRNAS Native Vulkan GUI LAB APK

on:
  push:
    branches:
      - feature/native-android-vulkan-gui
    paths:
      - "android-native-probe/**"
      - ".github/workflows/native-vulkan-gui-lab.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Setup Android NDK Vulkan and Gradle prerequisites
        run: |
          set -euxo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
          test -f "$ANDROID_HOME/ndk/27.2.12479018/sysroot/usr/include/vulkan/vulkan.h" || \
            test -f "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include/vulkan/vulkan.h"

      - name: Download previously validated Blender ARM64 PIE (no Blender rebuild)
        uses: actions/download-artifact@v4
        with:
          name: drnas-native-blender-android-arm64-39487417634
          run-id: 39487417634
          github-token: ${{ github.token }}
          path: /tmp/blender-native

      - name: Verify and stage headless LTS Blender alongside native Vulkan test
        run: |
          set -euxo pipefail
          ELF=/tmp/blender-native/blender
          test -s "$ELF"
          readelf -h "$ELF" | grep -E 'Class:.*ELF64'
          readelf -h "$ELF" | grep -E 'Machine:.*AArch64'
          readelf -h "$ELF" | grep -E 'Type:.*DYN'
          readelf -l "$ELF" | grep -F '/system/bin/linker64'
          LIB_DIR=android-native-probe/app/src/main/jniLibs/arm64-v8a
          mkdir -p "$LIB_DIR"
          cp "$ELF" "$LIB_DIR/libblender.so"
          "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" \
            --strip-debug "$LIB_DIR/libblender.so"
          readelf -h "$LIB_DIR/libblender.so" | grep -E 'Type:.*DYN'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile actual Vulkan NDK bridge and debug Android APK
        run: |
          set -euxo pipefail
          cd android-native-probe
          gradle --no-daemon --stacktrace :app:assembleDebug
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          unzip -l "$APK" | grep -F 'lib/arm64-v8a/libdrnas_vulkan.so'
          unzip -l "$APK" | grep -F 'lib/arm64-v8a/libblender.so'
          mkdir -p ../gui-vulkan-results
          cp "$APK" ../gui-vulkan-results/DRNAS-Native-Vulkan-GUI-LAB-debug.apk
          (
            cd ../gui-vulkan-results
            sha256sum DRNAS-Native-Vulkan-GUI-LAB-debug.apk > DRNAS-Native-Vulkan-GUI-LAB-debug.apk.sha256
          )
          cat > ../gui-vulkan-results/README.txt <<'EOF'
          DRNAS NATIVE VULKAN GUI LAB - EXPERIMENTAL
          App id: hr.drnas.nativevulkan
          Contains Android ARM64 Vulkan swapchain renderer and Blender headless LTS ELF.
          This is a Vulkan draw + controls smoke test, NOT Blender desktop GUI yet.
          Test Vulkan button and LTS button and copy/paste logs.
          Different app ID: does NOT replace DRNAS Native LAB or EmuDRNAS.
          EOF

      - name: Upload isolated Vulkan GUI LAB APK and checksum
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DRNAS-Native-Vulkan-GUI-LAB-${{ github.run_id }}
          path: gui-vulkan-results/
          if-no-files-found: warn
          retention-days: 14
