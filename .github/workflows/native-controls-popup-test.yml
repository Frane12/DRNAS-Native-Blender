name: Controls v6 TEST - separate sizes, tactile keys and double-tap latch

on:
  push:
    branches: [fix/native-controls-popup-windows]
    paths: [".github/workflows/native-controls-popup-test.yml", "native-gui-upstream/fix_native_control_windows.py", "native-gui-upstream/drnas_control_windows.java.inc", "native-gui-upstream/add_emu_control_options.py", "native-gui-upstream/drnas_mouse_options.java.inc", "native-gui-upstream/polish_controls_smooth_zoom.py", "native-gui-upstream/drnas_smooth_zoom.java.inc", "native-gui-upstream/drnas_native_smooth_zoom.py", "native-gui-upstream/fix_multitouch_spring_settings.py", "native-gui-upstream/DrnasZoomSpring.java", "native-gui-upstream/polish_cursor_button_style.py", "native-gui-upstream/add_save_before_exit.py", "native-gui-upstream/add_independent_sizes_input_latch.py", "native-gui-upstream/DrnasInputHold.java", "native-gui-upstream/drnas_hold_bindings.java.inc"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  repackage-without-native-compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out release patch scripts
        uses: actions/checkout@v4

      - name: Check out pinned upstream Java, manifest and resource sources only
        uses: actions/checkout@v4
        with:
          repository: simfeo/blender
          ref: d93bd33cba768e19ee4387a31c0ea137ee2f0047
          path: upstream
          fetch-depth: 1
          lfs: false
          submodules: false
          sparse-checkout: |
            build_files/android/apk
          sparse-checkout-cone-mode: true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download last successful DRNAS native APK - no C++ compilation
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p recovered
          curl -fL --retry 3 -o recovered/native-success-original.apk \
            https://github.com/Frane12/DRNAS-Native-Blender/releases/download/native-prealpha-v0.1/Native-Blender-PreAlpha-0.1-arm64.apk
          echo '4a9bd043bfba0bd256f50d8d96619adbd12fd7df0d5a43e7a18bc1b38b09ba26  recovered/native-success-original.apk' | sha256sum -c -
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify recovered/native-success-original.apk
          unzip -Z1 recovered/native-success-original.apk | grep -Fqx 'lib/arm64-v8a/libblender.so'
          unzip -Z1 recovered/native-success-original.apk | grep -Fqx 'assets/blender_runtime.zip'
          sha256sum recovered/native-success-original.apk > recovered/SOURCE-APK-SHA256.txt

      - name: Apply release Java-only changes to matching upstream source
        run: |
          set -euo pipefail
          python3 native-gui-upstream/create_sdl3_gui_preview.py upstream/build_files/android/apk
          python3 native-gui-upstream/add_drnas_controls.py upstream/build_files/android/apk
          python3 native-gui-upstream/add_shortcuts_ui_scaling.py upstream
          python3 native-gui-upstream/add_drnas_splash.py upstream
          python3 native-gui-upstream/add_adreno810_autoprofile.py upstream
          python3 native-gui-upstream/set_pre_alpha_app_identity.py upstream
          python3 native-gui-upstream/patch_release_exit_no_log.py upstream
          python3 native-gui-upstream/fix_native_control_windows.py upstream
          python3 native-gui-upstream/add_emu_control_options.py upstream
          python3 native-gui-upstream/polish_controls_smooth_zoom.py upstream
          python3 native-gui-upstream/fix_multitouch_spring_settings.py upstream
          python3 native-gui-upstream/polish_cursor_button_style.py upstream
          python3 native-gui-upstream/add_save_before_exit.py upstream
          python3 native-gui-upstream/add_independent_sizes_input_latch.py upstream
          python3 native-gui-upstream/test_smooth_zoom.py
          python3 native-gui-upstream/test_save_exit.py
          mkdir -p spring-test
          "$JAVA_HOME/bin/javac" -d spring-test native-gui-upstream/DrnasZoomSpring.java native-gui-upstream/DrnasZoomSpringTest.java
          "$JAVA_HOME/bin/java" -cp spring-test DrnasZoomSpringTest
          "$JAVA_HOME/bin/javac" -d spring-test native-gui-upstream/DrnasInputHold.java native-gui-upstream/DrnasInputHoldTest.java
          "$JAVA_HOME/bin/java" -cp spring-test DrnasInputHoldTest
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("upstream/build_files/android/apk/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          assert text.count('package="org.blender.blender"') == 1
          text = text.replace('package="org.blender.blender"',
                              'package="hr.drnas.blendernativecontrolstest2026v6"', 1)
          assert 'android:versionName="0.1.0"' in text, "Release version missing from actual aapt2 manifest"
          text = text.replace('android:versionCode="1"', 'android:versionCode="7"')
          text = text.replace('android:versionName="0.1.0"', 'android:versionName="0.1.6-latched-controls-test"')
          text = text.replace('Native Blender PreAlpha 0.1', 'Native Blender Latched Controls TEST')
          manifest.write_text(text)
          PY
          ! grep -Fq 'blender-startup.log' upstream/build_files/android/apk/app/src/main/java/org/blender/blender/BlenderActivity.java
          grep -Fq 'installDrnasAndroidBack();' upstream/build_files/android/apk/app/src/main/java/org/blender/blender/BlenderActivity.java

      - name: Rebuild ONLY Android Java, manifest, dex and APK container
        run: |
          set -euo pipefail
          ANDROID_JAR="$ANDROID_HOME/platforms/android-35/android.jar"
          BT="$ANDROID_HOME/build-tools/35.0.1"
          mkdir -p fast/unpacked fast/javac fast/dex fast/compiled
          unzip -q recovered/native-success-original.apk 'lib/*' 'assets/*' -d fast/unpacked
          test -s fast/unpacked/lib/arm64-v8a/libblender.so
          python3 native-gui-upstream/package_smooth_zoom_runtime.py fast/unpacked/assets/blender_runtime.zip
          JAVA_DIR=upstream/build_files/android/apk/app/src/main/java/org/blender/blender
          "$JAVA_HOME/bin/javac" --release 17 -classpath "$ANDROID_JAR" \
            -d fast/javac \
            "$JAVA_DIR/BlenderActivity.java" \
            "$JAVA_DIR/DrnasSplashActivity.java" \
            "$JAVA_DIR/DrnasGpuProfile.java" \
            "$JAVA_DIR/DrnasZoomSpring.java" \
            "$JAVA_DIR/DrnasInputHold.java"
          "$BT/d8" --min-api 31 --output fast/dex \
            $(find fast/javac -name '*.class')
          "$BT/aapt2" compile \
            --dir upstream/build_files/android/apk/app/src/main/res \
            -o fast/compiled/res.zip
          "$BT/aapt2" link -o fast/base.apk -I "$ANDROID_JAR" \
            --manifest upstream/build_files/android/apk/app/src/main/AndroidManifest.xml \
            fast/compiled/res.zip -A fast/unpacked/assets -0 zip \
            --min-sdk-version 31 --target-sdk-version 34
          mkdir -p native-controls-results
          OUT=native-controls-results/Native-Blender-Latched-Controls-v6-TEST-arm64.apk
          cp fast/base.apk "$OUT"
          (cd fast/dex && zip -q "../../$OUT" classes.dex)
          (cd fast/unpacked && zip -qr "../../$OUT" lib)
          "$BT/zipalign" -f -p 4 "$OUT" fast/aligned.apk
          mv fast/aligned.apk "$OUT"
          keytool -genkeypair \
            -keystore fast/drnas-prealpha.keystore -storepass android \
            -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=DRNAS PreAlpha Debug,O=DRNAS,C=HR"
          "$BT/apksigner" sign --ks fast/drnas-prealpha.keystore \
            --ks-pass pass:android --key-pass pass:android "$OUT"
          "$BT/apksigner" verify --verbose "$OUT"
          "$BT/aapt" dump badging "$OUT" | grep -F 'hr.drnas.blendernativecontrolstest2026v6'
          "$BT/aapt" dump badging "$OUT" | grep -F 'Native Blender Latched Controls TEST'
          "$BT/aapt" dump badging "$OUT" | grep -F "versionName='0.1.6-latched-controls-test'"
          unzip -Z1 "$OUT" | grep -Fqx 'lib/arm64-v8a/libblender.so'
          unzip -Z1 "$OUT" | grep -Fqx 'assets/blender_runtime.zip'
          # Critical: native library must be byte-identical to previous success.
          unzip -p recovered/native-success-original.apk lib/arm64-v8a/libblender.so | sha256sum > fast/original-native.sha
          unzip -p "$OUT" lib/arm64-v8a/libblender.so | sha256sum > fast/repacked-native.sha
          cmp fast/original-native.sha fast/repacked-native.sha
          python3 native-gui-upstream/verify_controls_repack.py recovered/native-success-original.apk "$OUT" --emu --smooth-runtime --spring --save-exit --latch
          (cd native-controls-results && sha256sum *.apk > SHA256SUMS.txt)
          cp native-gui-upstream/README.md native-controls-results/SOURCE-ATTRIBUTION.txt
          cp recovered/SOURCE-APK-SHA256.txt native-controls-results/SOURCE-APK-SHA256.txt
          ls -lh "$OUT"
          echo 'PASS: same successful native Blender binary; visible DRNAS control windows repackaged, signed and verified.'

      - name: Upload APK even if GitHub Release permission fails
        uses: actions/upload-artifact@v4
        with:
          name: Native-Blender-Latched-Controls-v6-TEST-${{ github.run_id }}
          path: native-controls-results/
          if-no-files-found: error
          retention-days: 30

