name: DRNAS Native GUI Controls Source Preflight

on:
  push:
    branches: [release/native-prealpha-0.1]
    paths:
      - "native-gui-upstream/**"
      - ".github/workflows/native-gui-controls-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact upstream Android Blender source
        uses: actions/checkout@v4
        with:
          repository: simfeo/blender
          ref: d93bd33cba768e19ee4387a31c0ea137ee2f0047
          path: upstream
          lfs: false
          submodules: false
          sparse-checkout: |
            intern/ghost/intern
            build_files/android/apk
          sparse-checkout-cone-mode: true
      - name: Verify pinned commit and patch scripts
        run: |
          set -euxo pipefail
          test "$(git -C upstream rev-parse HEAD)" = d93bd33cba768e19ee4387a31c0ea137ee2f0047
          python3 -m py_compile native-gui-upstream/*.py
          python3 native-gui-upstream/patch_native_ghost.py upstream
          python3 native-gui-upstream/create_sdl3_gui_preview.py upstream/build_files/android/apk
          python3 native-gui-upstream/add_drnas_controls.py upstream/build_files/android/apk
          python3 native-gui-upstream/patch_shortcut_ui_native.py upstream
          python3 native-gui-upstream/add_shortcuts_ui_scaling.py upstream
          python3 native-gui-upstream/patch_adreno810_resolution.py upstream
          python3 native-gui-upstream/add_drnas_splash.py upstream
          python3 native-gui-upstream/add_adreno810_autoprofile.py upstream
          python3 native-gui-upstream/set_pre_alpha_app_identity.py upstream
          python3 native-gui-upstream/patch_release_exit_no_log.py upstream
          grep -Fq 'void GHOST_SystemAndroid::dispatchDrnasInput' upstream/intern/ghost/intern/GHOST_SystemAndroid.cc
          grep -Fq 'nativeOnDrnasInput(7' upstream/build_files/android/apk/app/src/main/java/org/blender/blender/BlenderActivity.java
          grep -Fq 'nativeOnDrnasInput(' upstream/intern/ghost/intern/GHOST_AndroidMain.cc
          grep -Fq 'DRNAS_ANDROID_UI_DPI' upstream/intern/ghost/intern/GHOST_AndroidMemoryTier.hh
          grep -Fq 'KEYCODE_F12' upstream/build_files/android/apk/app/src/main/java/org/blender/blender/BlenderActivity.java
          grep -Fq 'DRNAS_A810_RENDER_LIMIT' upstream/intern/ghost/intern/GHOST_AndroidMemoryTier.hh
          grep -Fq 'Native Blender PreAlpha 0.1' upstream/build_files/android/apk/app/src/main/AndroidManifest.xml
          grep -Fq 'android:versionName="0.1.0"' upstream/build_files/android/apk/app/src/main/AndroidManifest.xml
          grep -Fq 'android:versionCode="1"' upstream/build_files/android/apk/app/src/main/AndroidManifest.xml
          grep -Fq 'DrnasGpuProfile.apply(this)' upstream/build_files/android/apk/app/src/main/java/org/blender/blender/BlenderActivity.java
          grep -Fq 'installDrnasAndroidBack();' upstream/build_files/android/apk/app/src/main/java/org/blender/blender/BlenderActivity.java
          grep -Fq 'closeSetupScreen()' upstream/build_files/android/apk/app/src/main/java/org/blender/blender/DrnasSplashActivity.java
          ! grep -Fq 'blender-startup.log' upstream/build_files/android/apk/app/src/main/java/org/blender/blender/BlenderActivity.java
          ! grep -Fq 'Log: ' upstream/build_files/android/apk/app/src/main/java/org/blender/blender/BlenderActivity.java
          echo 'DRNAS Native Blender PreAlpha 0.1 patch + system back preflight PASS'
      - name: Compile modified Android Java without a full Blender build
        run: |
          set -euxo pipefail
          ANDROID_JAR="$ANDROID_HOME/platforms/android-35/android.jar"
          if [ ! -f "$ANDROID_JAR" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35"
          fi
          mkdir -p /tmp/drnas-preflight-java
          javac --release 17 -classpath "$ANDROID_JAR" -d /tmp/drnas-preflight-java \
            upstream/build_files/android/apk/app/src/main/java/org/blender/blender/BlenderActivity.java \
            upstream/build_files/android/apk/app/src/main/java/org/blender/blender/DrnasGpuProfile.java \
            upstream/build_files/android/apk/app/src/main/java/org/blender/blender/DrnasSplashActivity.java
